name: Compile and Deploy Sphinx Documentation

on:
  push:
    branches:
      - main

# Grant explicit permissions required to write build outputs to GitHub Pages
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Infrastructure
        uses: actions/checkout@v4

      - name: Initialise Active Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev  # Required to compile the psycopg2 database driver

      - name: Install Architecture Packages
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Compile Static HTML Web Assets via Sphinx
        run: |
          cd docs
          make html

      - name: Deploy Generated Manuals to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: docs/build/html
          branch: gh-pages
